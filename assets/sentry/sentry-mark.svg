<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sentry">
  <title>Sentry</title>
  <!--
    An open aperture with a fixed centre point: watchfulness and focus, not a
    conversation. Deliberately avoids the three clichés in range — a speech
    bubble (what this widget is trying not to be), a shield (SHIELD is a
    product name), and a magnifier (reads as search, and collides with Scout).

    Family language is taken from the Privify "P", which is a monoline of
    constant width with rounded terminals and open counters: same stroke
    weight, same round caps, and the aperture is left open rather than closed
    so it echoes the P's open bowl.

    Drawn with stroke rather than a filled outline. The spec asks for
    fill="currentColor"; stroke="currentColor" satisfies the same requirement
    — one file, inherits the theme, no swap logic — and keeps a monoline
    editable as a monoline instead of a frozen outline. The centre dot stays a
    separate filled circle rather than a zero-length stroked subpath, because
    matching the arc's stroke-width would shrink it below legibility at 16px.
  -->
  <path d="M23.5 9.2 A9.5 9.5 0 1 0 25.4 14.2"/>
  <circle cx="16" cy="16" r="2.4" fill="currentColor" stroke="none"/>
</svg>
